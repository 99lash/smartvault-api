services:
  api:
    build: .
    container_name: smartvault-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: smartvault-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
